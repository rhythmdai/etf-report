name: 每日调仓信号推送（Server酱）

# 触发方式：外部定时器 cron-job.org 在 14:38（北京时间）调用 workflow_dispatch。
#   POST https://api.github.com/repos/rhythmdai/etf-report/actions/workflows/serverchan_daily.yml/dispatches
# 为什么不用 GitHub 自带 cron：schedule 的排队延迟不可控（实测漂 1~3 小时），
# 而这条推送必须在 14:45 之前到手，才能赶在 14:57 收盘集合竞价前下单。
# 时间预算：外部触发 → runner 启动约 23s → 跑完推送约 40s，合计约 1 分钟（p95 约 3 分钟）。
# 非交易日由脚本第一步 is_trading_day() 直接退出，不会发消息。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（只打印，不推送到微信）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get date
        id: date
        env:
          TZ: Asia/Shanghai
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore quant data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/quant
          key: quant-data-${{ steps.date.outputs.date }}-sc
          restore-keys: quant-data-
          enableCrossOsArchive: true

      - name: Full fetch on cold start
        run: |
          if [ -z "$(ls -A data/quant/*_daily.csv 2>/dev/null)" ]; then
            echo "No daily data — full fetch"
            python scripts/quant_data_fetcher.py --full
          else
            echo "Daily data present — skip full fetch"
          fi

      - name: Run signal push
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 不写死预设：推送跟随 src/etf_report/core/quant_contract.py 的 DEFAULT_PRESET，
          # 也就是「当前正在使用的预设」。现在它是 zen-nl（禅修者·无杠杆·仓位 60~100%·MH=2）。
        run: |
          FLAGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then FLAGS="--dry-run"; fi
          python scripts/preclose_push.py $FLAGS

      - name: Save quant data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/quant
          key: quant-data-${{ steps.date.outputs.date }}-sc
          enableCrossOsArchive: true
